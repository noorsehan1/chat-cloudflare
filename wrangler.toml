name = "chat-cloudflare"
main = "index.js"
compatibility_date = "2024-12-12"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "chat"
database_id = "cd64506c-a09e-4ee3-9e21-67b41f2a7378"

# Durable Objects
[durable_objects]
bindings = [
  { name = "CHAT_SERVER", class_name = "ChatServer" },
  { name = "GAME_SERVER", class_name = "GameServer" }
]

# Migrations
[[migrations]]
tag = "v1"
new_classes = ["ChatServer", "GameServer"]
